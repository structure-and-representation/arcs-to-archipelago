<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">

  <meta property="og:description" content="都道府県間の人口移動 2012–2025年を、arc diagram から日本列島の地図へ。総務省「住民基本台帳人口移動報告」より。">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://arcs-to-archipelago.structure-and-representation.com/ogp.png">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F3F0E8'/%3E%3Cpath d='M4 22C8 4 24 4 28 22' fill='none' stroke='%231C1B18' stroke-width='2'/%3E%3C/svg%3E">
  <script>
    // 末尾スラッシュなしのディレクトリ URL(例: /works/x)で開かれても、相対参照を解決できるようにする。
    (function () {
      var p = location.pathname;
      if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) {
        var b = document.createElement('base');
        b.href = p + '/';
        document.head.appendChild(b);
      }
    })();
    // 描画の前に、テーマと言語を <html> へ反映する(最初の一枚が違う色や言語でちらつかないように)。
    // main.js が同じ規則で state を作り、以降は state が正になる。
    (function () {
      var q = new URLSearchParams(location.search);
      var root = document.documentElement;
      var theme = q.get('theme');
      if (theme !== 'paper' && theme !== 'ink') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'ink' : 'paper';
      root.dataset.theme = theme;
      var lang = q.get('lang');
      if (lang !== 'ja' && lang !== 'en') lang = /^en/i.test(navigator.language || '') ? 'en' : 'ja';
      root.lang = lang;
    })();
  </script>
  <!-- Web フォント。接続を先に開き、CSS は描画を止めないように読む。作品名だけは text= で数 KB の部分集合を先に読む(作品名を変えたら text= も変える) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&text=%E9%83%BD%E9%81%93%E5%BA%9C%E7%9C%8C%E3%82%92%E3%81%BE%E3%81%9F%E3%81%90%E4%BA%BA%E3%81%AE%E6%B5%81%E3%82%8C&display=block">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"></noscript>
  <script type="module" src="./src/main.js"></script>

  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NGJDJ425"></script>

</head>
<body>
  <div id="app">
    <!-- 描画。キャンバスは透明で、紙の質感は CSS の背景(body の疑似要素)で作る -->
    <canvas id="stage" role="img" aria-label="都道府県間の人口移動を弧で表した図。1粒が100人です。" data-i18n-attr="aria-label:app.stage"></canvas>
    <!-- 都道府県名のラベル(ui/labels.js が毎フレーム射影した位置へ動かす) -->
    <div id="labels" aria-hidden="true"></div>

    <!-- 上の帯(作品名と副題)。章の目次と位置の表示(#chapters の中)がこの上に重なれるよう、#chapters より前に置く -->
    <header id="masthead">
      <div class="masthead-title">
        <h1 data-i18n="meta.title">都道府県をまたぐ人の流れ</h1>
        <p data-i18n="meta.subtitle">住民基本台帳人口移動報告 2012–2025年</p>
      </div>
    </header>
    <!-- 操作(ui/controls.js)。上の帯の右側の領域。中の部品(カメラなど)は、base.css の領域の値を使って自分で固定位置に置ける -->
    <div id="controls" role="toolbar"></div>

    <!-- 章の本文と目次(ui/chapters.js が content/chapters.js から作る)。ページのスクロールで 0〜4 章を進める -->
    <main id="chapters" tabindex="-1"></main>

    <!-- 凡例と注記(ui/legend.js) -->
    <div id="legend"></div>

    <!-- 年の切り替えと地域の選択。デスクトップでは各部品が自分の領域に置かれ、縦画面ではドックの中に積まれる -->
    <div id="dock">
      <!-- 地域の選択と読み出し(ui/selector.js) -->
      <div id="selector" role="group" aria-label="地域" data-i18n-attr="aria-label:selector.label"></div>
      <!-- 年の切り替え(ui/timeline.js) -->
      <nav id="timeline" aria-label="年" data-i18n-attr="aria-label:year.label"></nav>
    </div>

    <!-- ホバー中の弧・都道府県の数値(ui/tooltip.js) -->
    <div id="tooltip" role="tooltip" hidden></div>
    <!-- 数値の表(ui/table.js)。上の帯の「数値の表」(ui/controls.js)から <dialog> で開く -->
    <div id="table"></div>

    <p id="message" role="status" hidden></p>
  </div>
</body>
</html>
