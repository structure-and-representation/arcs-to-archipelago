<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>弧が列島になる — 都道府県間の人口移動</title>
  <meta name="description" content="総務省統計局「住民基本台帳人口移動報告」(日本人移動者、2012〜2025年)をもとに、都道府県間の人口移動を、日本列島の上に立ち上がる弧として見せる作品です。">
  <meta name="color-scheme" content="light dark">
  <script>
    // 末尾スラッシュなしのディレクトリ URL(例: /works/x)で開かれても、相対参照を解決できるようにする。
    (function () {
      var p = location.pathname;
      if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) {
        var b = document.createElement('base');
        b.href = p + '/';
        document.head.appendChild(b);
      }
    })();
  </script>
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/layout.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div id="app">
    <!-- 描画。キャンバスは透明で、紙の質感は CSS の背景で作る -->
    <canvas id="stage" role="img" aria-label="都道府県間の人口移動を弧で表した図。1粒が100人です。" data-i18n-attr="aria-label:app.stage"></canvas>
    <!-- 都道府県名のラベル(ui/labels.js が毎フレーム射影した位置へ動かす) -->
    <div id="labels" aria-hidden="true"></div>

    <!-- 章の本文(ui/chapters.js)。スクロールで 0〜4 章を進める -->
    <main id="chapters">
      <section class="chapter" data-chapter="0">
        <h2 data-i18n="ch.0.title">全国</h2>
        <p data-i18n="ch.0.body"></p>
      </section>
      <section class="chapter" data-chapter="1">
        <h2 data-i18n="ch.1.title">東京一極</h2>
        <p data-i18n="ch.1.body"></p>
      </section>
      <section class="chapter" data-chapter="2">
        <h2 data-i18n="ch.2.title">大阪圏</h2>
        <p data-i18n="ch.2.body"></p>
      </section>
      <section class="chapter" data-chapter="3">
        <h2 data-i18n="ch.3.title">名古屋圏</h2>
        <p data-i18n="ch.3.body"></p>
      </section>
      <section class="chapter" data-chapter="4">
        <h2 data-i18n="ch.4.title">自由探索</h2>
        <p data-i18n="ch.4.body"></p>
      </section>
    </main>

    <!-- 年の切り替え(ui/timeline.js) -->
    <nav id="timeline" aria-label="年" data-i18n-attr="aria-label:year.label"></nav>
    <!-- 地域の選択(ui/selector.js) -->
    <div id="selector" role="group" aria-label="地域" data-i18n-attr="aria-label:selector.label"></div>
    <!-- 操作ボタン: カメラ・テーマ・言語・動きを減らす(ui/controls.js) -->
    <div id="controls" role="toolbar"></div>
    <!-- ホバー中の弧・都道府県の数値(ui/tooltip.js) -->
    <div id="tooltip" role="tooltip" hidden></div>
    <!-- 数値の表(ui/table.js)。図と同じ数値をキーボードと読み上げで読める -->
    <details id="table"><summary data-i18n="table.title">数値の表</summary><div class="table-body"></div></details>

    <p id="message" role="status" hidden></p>
  </div>
</body>
</html>
